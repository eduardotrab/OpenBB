[project]
name = "openbb-tesouro"
version = "0.1.0"
description = "Tesouro Nacional (Tesouro Direto) provider extension for OpenBB Platform."
authors = [{ name = "Eduardo Lima", email = "213545207+eduardotrab@users.noreply.github.com" }]
license = { text = "Apache-2.0" }
readme = "README.md"
requires-python = ">=3.10,<4"
dependencies = ["openbb-core>=2.0.0"]

[project.entry-points."openbb_provider_extension"]
tesouro = "openbb_tesouro:tesouro_provider"

[project.entry-points."openbb_core_extension"]
tesouro = "openbb_tesouro.tesouro_router:router"

[project.urls]
Repository = "https://github.com/eduardotrab/openbb"

[dependency-groups]
dev = ["openbb-devtools>=2.0.1"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["openbb_tesouro"]

[tool.ruff]
line-length = 88
target-version = "py310"
fix = true

[tool.ruff.lint]
select = ["D", "E", "W", "F", "S", "UP", "I", "PLC", "PLE", "PLR", "PLW", "SIM", "T20"]
ignore = [
    "PLR2004", "PLR0913", "PLR0915", "PLR0917", "PLC0415",
    "E402", "E501",
    "D202", "D203", "D205", "D206", "D210", "D212", "D213", "D214",
    "D215", "D300", "D400", "D404", "D405", "D406", "D407", "D408",
    "D409", "D410", "D411", "D413", "D415", "D416", "D417",
]

[tool.ruff.lint.per-file-ignores]
"openbb_tesouro/models/*.py" = ["ARG002"]
"tests/**" = ["S101", "D"]
"integration/**" = ["S101", "D"]
"**/__init__.py" = ["F401"]

[tool.ruff.lint.isort]
combine-as-imports = true
force-wrap-aliases = true

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ty]
[tool.ty.environment]
python-version = "3.10"

[tool.ty.src]
include = ["openbb_tesouro"]
exclude = ["tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "record_http: VCR-backed HTTP cassette tests",
    "integration: live integration tests against the Tesouro Transparente files",
]
