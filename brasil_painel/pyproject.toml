[project]
name = "brasil-painel"
version = "0.1.0"
description = "Painel próprio (Dash) sobre a API OpenBB com fontes públicas brasileiras."
requires-python = ">=3.10"
dependencies = [
    "dash==4.4.1",
    "flask-login==0.6.3",
    "gunicorn==26.1.0",
    "requests",
]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
painel = "brasil_painel.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["brasil_painel*"]

[tool.setuptools.package-data]
brasil_painel = ["assets/*"]
