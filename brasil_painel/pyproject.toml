[project]
name = "brasil-painel"
version = "0.1.0"
description = "Painel próprio (Dash) sobre a API OpenBB com fontes públicas brasileiras."
requires-python = ">=3.10"
dependencies = [
    "dash==4.4.1",
    "duckdb==1.5.6",
    "flask-login==0.6.3",
    "gunicorn==26.1.0",
    "pandas",
    "pyarrow",
    "requests",
]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
painel = "brasil_painel.__main__:main"
painel-usuarios = "brasil_painel.cli:main"
painel-dados = "brasil_painel.regional.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["brasil_painel*"]

[tool.setuptools.package-data]
brasil_painel = ["assets/*", "assets/topojson/*", "dados/*.toml", "dados/*.json"]

[tool.ruff]
extend = "../ruff.toml"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D", "S101", "S105", "S106"]
"brasil_painel/cli.py" = ["T201"]
"brasil_painel/regional/cli.py" = ["T201"]
